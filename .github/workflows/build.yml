name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    needs: [api, database, security]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17
        shell: bash
        run: |
          java -version
          javac -version
          java_major="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.version =/ {print $2}' | cut -d. -f1)"
          test "$java_major" = "17"

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle checks
        shell: bash
        run: |
          test -s gradle/verification-metadata.xml
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleDebug :app:assembleRelease
          test -s apps/android/schemas/com.sagarsystemslab.nownetwork.data.local.NowDatabase/1.json
          git diff --exit-code -- gradle/verification-metadata.xml apps/android/schemas


  android-instrumented:
    needs: [android]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17
        shell: bash
        run: |
          java -version
          javac -version
          java_major="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.version =/ {print $2}' | cut -d. -f1)"
          test "$java_major" = "17"

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Instrumented persistence tests
        shell: bash
        run: |
          set -Eeuo pipefail

          export ANDROID_SERIAL=emulator-5554
          AVD_NAME=now-ci
          EMULATOR_LOG="$RUNNER_TEMP/now-emulator.log"

          cleanup() {
            adb -s "$ANDROID_SERIAL" emu kill >/dev/null 2>&1 || true
          }
          diagnostics() {
            echo "----- emulator log -----"
            tail -n 250 "$EMULATOR_LOG" 2>/dev/null || true
            echo "----- adb devices -----"
            adb devices -l || true
          }
          trap cleanup EXIT
          trap diagnostics ERR

          SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/.android/sdk}"
          EMULATOR_BIN="$SDK_ROOT/emulator/emulator"
          ADB_BIN="$SDK_ROOT/platform-tools/adb"
          SYSTEM_IMAGE_DIR="$SDK_ROOT/system-images/android-35/aosp_atd/x86_64"

          if [ ! -x "$EMULATOR_BIN" ] || [ ! -x "$ADB_BIN" ] || [ ! -d "$SYSTEM_IMAGE_DIR" ]; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager \
              "platform-tools" \
              "emulator" \
              "system-images;android-35;aosp_atd;x86_64"
          fi

          test -x "$EMULATOR_BIN"
          test -x "$ADB_BIN"
          test -d "$SYSTEM_IMAGE_DIR"

          AVD_CONFIG="$HOME/.android/avd/$AVD_NAME.avd/config.ini"
          if [ ! -f "$AVD_CONFIG" ]; then
            echo "no" | avdmanager create avd               --force               --name "$AVD_NAME"               --package "system-images;android-35;aosp_atd;x86_64"
          fi
          test -f "$AVD_CONFIG"
          sed -i '/^disk.dataPartition.size=/d' "$AVD_CONFIG"
          echo "disk.dataPartition.size=4096M" >> "$AVD_CONFIG"

          sudo chmod 666 /dev/kvm || true

          nohup "$EMULATOR_BIN"             -avd "$AVD_NAME"             -port 5554             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -cores 2             -memory 2048             > "$EMULATOR_LOG" 2>&1 &

          timeout 90 adb -s "$ANDROID_SERIAL" wait-for-device
          timeout 240 bash -c '
            until [ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 2
            done
          '

          adb -s "$ANDROID_SERIAL" shell settings put global window_animation_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put global transition_animation_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put global animator_duration_scale 0
          adb -s "$ANDROID_SERIAL" shell input keyevent 82 || true

          chmod +x ./gradlew
          if ! ./gradlew --no-daemon :app:connectedDebugAndroidTest; then
            echo "----- instrumented test results -----"
            find apps/android/build/outputs/androidTest-results -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
            exit 1
          fi


  api:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"

      - name: Checks
        shell: bash
        run: |
          deno fmt --check backend packages/contracts packages/domain packages/policy supabase/functions/now-api tests scripts/solana/local-validator-client.ts
          deno lint backend packages/contracts packages/domain packages/policy supabase/functions/now-api tests scripts/solana/local-validator-client.ts
          cd backend
          deno task check
          deno task test

  database:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis@sha256:1e85984a7261b01b38a8e7d4166abcdb35370e6b7667a6d6fd9caa057f64eab6
        env:
          POSTGRES_DB: now_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d now_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply migrations
        shell: bash
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 60); do
            if docker logs "$DB_CONTAINER" 2>&1               | grep -Fq "PostgreSQL init process complete; ready for start up."; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "PostgreSQL container initialization did not complete"
              docker logs "$DB_CONTAINER"
              exit 1
            fi
            sleep 1
          done

          for attempt in $(seq 1 30); do
            if docker exec "$DB_CONTAINER" pg_isready -U postgres -d now_test >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "PostgreSQL final server did not become ready"
              docker logs "$DB_CONTAINER"
              exit 1
            fi
            sleep 1
          done

          test "$(docker exec "$DB_CONTAINER" postgres --version)" = "postgres (PostgreSQL) 17.11"

          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 <<'SQL'
          drop extension if exists postgis cascade;
          create schema if not exists extensions;
          create extension postgis with schema extensions;
          SQL

          postgis_schema="$(
            docker exec "$DB_CONTAINER" psql -XAtq -U postgres -d now_test -c "
              select n.nspname
              from pg_extension e
              join pg_namespace n on n.oid = e.extnamespace
              where e.extname = 'postgis';
            "
          )"
          test "$postgis_schema" = "extensions"

          while IFS= read -r migration; do
            echo "Applying $migration"
            docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 < "$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Verify financial replay guards
        shell: bash
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 < tests/database/financial_replay_guards.sql

      - name: Verify wallet binding guards
        shell: bash
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 < tests/database/wallet_binding_guards.sql

      - name: Verify state read guards
        shell: bash
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 < tests/database/state_read_guards.sql

      - name: Verify refresh coordination guards
        shell: bash
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 < tests/database/refresh_coordination_guards.sql

      - name: Verify opportunity guards
        shell: bash
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 < tests/database/opportunity_guards.sql

      - name: Verify database security baseline
        shell: bash
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail

          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            missing_relations text;
          begin
            with expected(schema_name, table_name) as (
              values
                ('app', 'actors'),
                ('app', 'actor_auth_principals'),
                ('app', 'wallet_bindings'),
                ('app', 'wallet_binding_challenges'),
                ('app', 'locations'),
                ('app', 'state_definitions'),
                ('app', 'live_states'),
                ('app', 'state_history'),
                ('app', 'refresh_requests'),
                ('app', 'refresh_contributions'),
                ('app', 'refresh_acceptances'),
                ('app', 'evidence_challenges'),
                ('app', 'evidence_packets'),
                ('app', 'evidence_location_samples'),
                ('app', 'verification_results'),
                ('app', 'settlement_operations'),
                ('app', 'refund_operations'),
                ('app', 'receipts'),
                ('app', 'receipt_annotations'),
                ('app', 'idempotency_records'),
                ('app', 'domain_events'),
                ('app', 'security_events'),
                ('app', 'outbox_events'),
                ('public', 'realtime_events_v1')
            ),
            rls_state as (
              select
                expected.schema_name,
                expected.table_name,
                c.relrowsecurity
              from expected
              left join pg_namespace n
                on n.nspname = expected.schema_name
              left join pg_class c
                on c.relnamespace = n.oid
               and c.relname = expected.table_name
               and c.relkind in ('r', 'p')
            )
            select string_agg(
              schema_name || '.' || table_name,
              ', ' order by schema_name, table_name
            )
            into missing_relations
            from rls_state
            where coalesce(relrowsecurity, false) = false;

            if missing_relations is not null then
              raise exception 'RLS disabled or relation missing: %', missing_relations;
            end if;
          end
          $$;
          SQL

          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 <<'SQL'
          create role now_anon nologin;
          grant usage on schema app to now_anon;
          grant select, insert on app.actors to now_anon;
          grant select on public.realtime_events_v1 to now_anon;

          insert into app.actors(actor_id, status)
          values ('00000000-0000-0000-0000-000000000001', 'ACTIVE');

          insert into public.realtime_events_v1(
            realtime_event_id,
            event_type,
            entity_type,
            entity_id,
            audience_type,
            payload
          ) values (
            '00000000-0000-0000-0000-000000000002',
            'STATE_UPDATED',
            'STATE',
            '00000000-0000-0000-0000-000000000003',
            'PUBLIC_ENTITY',
            '{}'::jsonb
          );
          SQL

          actor_rows="$(docker exec "$DB_CONTAINER" psql -XAtq -U postgres -d now_test             -c "set role now_anon; select count(*) from app.actors;")"
          test "$actor_rows" = "0"

          realtime_rows="$(docker exec "$DB_CONTAINER" psql -XAtq -U postgres -d now_test             -c "set role now_anon; select count(*) from public.realtime_events_v1;")"
          test "$realtime_rows" = "0"

          if docker exec "$DB_CONTAINER" psql -XAtq -U postgres -d now_test -v ON_ERROR_STOP=1             -c "set role now_anon; insert into app.actors(actor_id, status) values ('00000000-0000-0000-0000-000000000004', 'ACTIVE');"
          then
            echo "RLS write isolation failed"
            exit 1
          fi

  program:
    needs: [api, database, security]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pinned native toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "$HOME/.cargo/env"
          . "$HOME/.cargo/env"

          AGAVE_BIN="$HOME/agave-4.1.2/solana-release/bin"
          ANCHOR_BIN="$HOME/.local/bin"

          test -x "$HOME/.cargo/bin/rustup"
          test -x "$AGAVE_BIN/solana"
          test -x "$ANCHOR_BIN/anchor"

          export PATH="$HOME/.cargo/bin:$AGAVE_BIN:$ANCHOR_BIN:$PATH"
          printf '%s\n' "$HOME/.cargo/bin" "$AGAVE_BIN" "$ANCHOR_BIN" >> "$GITHUB_PATH"

          rustup toolchain list | grep -Fq '1.98.1-x86_64-unknown-linux-gnu'

          rustup run 1.98.1 rustc --version | grep -E '^rustc 1\.98\.1 '
          rustup run 1.98.1 cargo --version
          solana --version | grep -F '4.1.2'
          anchor --version | grep -F '1.2.0'

      - name: Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"

      - name: Rust tests
        shell: bash
        run: |
          test -s Cargo.lock
          cargo test --workspace --locked

      - name: Anchor build
        shell: bash
        run: |
          anchor build
          git diff --exit-code -- Cargo.lock

      - name: Local validator qualification
        shell: bash
        run: |
          bash -n scripts/solana/qualify-local-validator.sh
          deno check scripts/solana/local-validator-client.ts
          scripts/solana/qualify-local-validator.sh

      - name: Devnet deployment preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          bash -n scripts/solana/qualify-devnet.sh
          NOW_DEVNET_MODE=static scripts/solana/qualify-devnet.sh

          TMP_KEY_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_KEY_DIR" "$PWD/ci-ephemeral-keypair.json"' EXIT

          solana-keygen new \
            --no-bip39-passphrase \
            --silent \
            --force \
            --outfile "$TMP_KEY_DIR/wrong-keypair.json"

          if output="$(
            NOW_DEVNET_MODE=identity \
            NOW_DEVNET_PROGRAM_KEYPAIR="$TMP_KEY_DIR/wrong-keypair.json" \
            scripts/solana/qualify-devnet.sh 2>&1
          )"; then
            echo "wrong program keypair unexpectedly passed"
            exit 1
          fi
          grep -Fq "DEVNET_QUALIFICATION_FAIL=PROGRAM_IDENTITY_MISMATCH" <<<"$output"

          solana-keygen new \
            --no-bip39-passphrase \
            --silent \
            --force \
            --outfile "$PWD/ci-ephemeral-keypair.json"

          if output="$(
            NOW_DEVNET_MODE=identity \
            NOW_DEVNET_PROGRAM_KEYPAIR="$PWD/ci-ephemeral-keypair.json" \
            scripts/solana/qualify-devnet.sh 2>&1
          )"; then
            echo "repository-local keypair unexpectedly passed"
            exit 1
          fi
          grep -Fq "DEVNET_QUALIFICATION_FAIL=PROGRAM_KEYPAIR_INSIDE_REPOSITORY" <<<"$output"

      - name: Protocol transaction qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/solana/protocol-flow-client.py
          bash -n scripts/solana/protocol-flow-common.sh
          bash -n scripts/solana/qualify-protocol-flow-local.sh
          bash -n scripts/solana/qualify-devnet-flow.sh
          scripts/solana/qualify-protocol-flow-local.sh

  security:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan
        shell: bash
        run: ./scripts/security/scan-secrets.sh
