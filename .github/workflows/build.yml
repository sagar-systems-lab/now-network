name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle checks
        shell: bash
        run: |
          test -s gradle/verification-metadata.xml
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleDebug :app:assembleRelease
          git diff --exit-code -- gradle/verification-metadata.xml

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"

      - name: Checks
        shell: bash
        run: |
          deno fmt --check backend packages/contracts packages/domain supabase/functions/now-api tests
          deno lint backend packages/contracts packages/domain supabase/functions/now-api tests
          cd backend
          deno task check
          deno task test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis@sha256:1e85984a7261b01b38a8e7d4166abcdb35370e6b7667a6d6fd9caa057f64eab6
        env:
          POSTGRES_DB: now_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d now_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply migrations
        shell: bash
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail

          test "$(docker exec "$DB_CONTAINER" postgres --version)" = "postgres (PostgreSQL) 17.11"

          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 <<'SQL'
          drop extension if exists postgis cascade;
          create schema if not exists extensions;
          create extension postgis with schema extensions;
          SQL

          while IFS= read -r migration; do
            echo "Applying $migration"
            docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 < "$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Verify database security baseline
        shell: bash
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail

          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            missing_relations text;
          begin
            with expected(schema_name, table_name) as (
              values
                ('app', 'actors'),
                ('app', 'actor_auth_principals'),
                ('app', 'wallet_bindings'),
                ('app', 'locations'),
                ('app', 'state_definitions'),
                ('app', 'live_states'),
                ('app', 'state_history'),
                ('app', 'refresh_requests'),
                ('app', 'refresh_contributions'),
                ('app', 'refresh_acceptances'),
                ('app', 'evidence_challenges'),
                ('app', 'evidence_packets'),
                ('app', 'evidence_location_samples'),
                ('app', 'verification_results'),
                ('app', 'settlement_operations'),
                ('app', 'refund_operations'),
                ('app', 'receipts'),
                ('app', 'receipt_annotations'),
                ('app', 'idempotency_records'),
                ('app', 'domain_events'),
                ('app', 'security_events'),
                ('app', 'outbox_events'),
                ('public', 'realtime_events_v1')
            ),
            rls_state as (
              select
                expected.schema_name,
                expected.table_name,
                c.relrowsecurity
              from expected
              left join pg_namespace n
                on n.nspname = expected.schema_name
              left join pg_class c
                on c.relnamespace = n.oid
               and c.relname = expected.table_name
               and c.relkind in ('r', 'p')
            )
            select string_agg(
              schema_name || '.' || table_name,
              ', ' order by schema_name, table_name
            )
            into missing_relations
            from rls_state
            where coalesce(relrowsecurity, false) = false;

            if missing_relations is not null then
              raise exception 'RLS disabled or relation missing: %', missing_relations;
            end if;
          end
          $$;
          SQL

          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d now_test -v ON_ERROR_STOP=1 <<'SQL'
          create role now_anon nologin;
          grant usage on schema app to now_anon;
          grant select, insert on app.actors to now_anon;
          grant select on public.realtime_events_v1 to now_anon;

          insert into app.actors(actor_id, status)
          values ('00000000-0000-0000-0000-000000000001', 'ACTIVE');

          insert into public.realtime_events_v1(
            realtime_event_id,
            event_type,
            entity_type,
            entity_id,
            audience_type,
            payload
          ) values (
            '00000000-0000-0000-0000-000000000002',
            'STATE_UPDATED',
            'STATE',
            '00000000-0000-0000-0000-000000000003',
            'PUBLIC_ENTITY',
            '{}'::jsonb
          );
          SQL

          actor_rows="$(docker exec "$DB_CONTAINER" psql -XAtq -U postgres -d now_test             -c "set role now_anon; select count(*) from app.actors;")"
          test "$actor_rows" = "0"

          realtime_rows="$(docker exec "$DB_CONTAINER" psql -XAtq -U postgres -d now_test             -c "set role now_anon; select count(*) from public.realtime_events_v1;")"
          test "$realtime_rows" = "0"

          if docker exec "$DB_CONTAINER" psql -XAtq -U postgres -d now_test -v ON_ERROR_STOP=1             -c "set role now_anon; insert into app.actors(actor_id, status) values ('00000000-0000-0000-0000-000000000004', 'ACTIVE');"
          then
            echo "RLS write isolation failed"
            exit 1
          fi

  program:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version
          cargo --version

      - name: Install Agave
        shell: bash
        run: |
          mkdir -p "$HOME/agave"
          curl --fail --silent --show-error --location             --output "$RUNNER_TEMP/solana-release.tar.bz2"             "https://github.com/anza-xyz/agave/releases/download/v4.1.2/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770  $RUNNER_TEMP/solana-release.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/solana-release.tar.bz2" -C "$HOME/agave"
          echo "$HOME/agave/solana-release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --silent --show-error --location             --output "$RUNNER_TEMP/anchor"             "https://github.com/otter-sec/anchor/releases/download/v1.2.0/anchor-1.2.0-x86_64-unknown-linux-gnu"
          echo "0c9c41a3292c281cc6eadb78d6e1c8224d8324a34b0736a89d640fd314db05b7  $RUNNER_TEMP/anchor" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/anchor" "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Versions
        shell: bash
        run: |
          solana --version
          anchor --version

      - name: Rust tests
        shell: bash
        run: |
          test -s Cargo.lock
          cargo test --workspace --locked

      - name: Anchor build
        shell: bash
        run: |
          anchor build
          git diff --exit-code -- Cargo.lock

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan
        shell: bash
        run: ./scripts/security/scan-secrets.sh
